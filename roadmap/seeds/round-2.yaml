      UMM-C or UMM-G field, where the rule is written, how the sweeper checks
      it, and whether it is a mandate or a reviewed practice.
    datasets: []
    requirements:
      - {slug: granule-extents-within-collection, class: SHOULD}
      - {slug: cloud-direct-access-urls, class: SHOULD}
      - {slug: science-keywords-valid, class: SHOULD}
      - {slug: version-and-doi-agree, class: SHOULD}
      - {slug: processing-level-and-format-stated, class: MUST}
    gotchas: []
    eval: null
    sources:
      - domain: wiki.earthdata.nasa.gov
        read: "the UMM-C and UMM-G documentation and the metadata requirement pages"
      - domain: cmr.earthdata.nasa.gov
        read: "the UMM JSON schemas and the CMR documentation for the fields named"
