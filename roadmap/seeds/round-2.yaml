  - id: seed-ornldaac-daymet
    title: Daymet V4 for the new ornldaac bundle
    repo: nasa-daac-knowledge
    bundle: knowledge/ornldaac
    branch: claude/seed-ornldaac-daymet
    issue: 140
    spheres: [atmosphere, land]
    scope: >-
      The first concepts of the scaffolded, empty knowledge/ornldaac/ bundle
      (fill the sections, add a log entry, re-render the digest). One dataset
      concept for Daymet version 4 (daily surface weather on a 1 km grid for
      North America, Hawaii and Puerto Rico; the variables; the tiles, the
      mosaics and the region files; the CMR concept ids) and four to five
      gotchas: every Daymet year has 365 days and December 31 is dropped in
      leap years, so a join on calendar dates misaligns after February in a
      leap year; the grid is a Lambert conformal conic projection and a
      cell's area is not one square kilometre everywhere; tiles and mosaics
      hold the same values in different files and the region files differ
      in extent; the V4 R1 correction changed stated variables for stated
      years; the values are interpolated from stations and station-sparse
      terrain carries larger error, which the cross-validation statistics
      quantify.
    datasets:
      - {slug: daymet-v4}
    gotchas:
      - {slug: daymet-365-day-year, severity: high}
      - {slug: daymet-lcc-projection-and-cell-area, severity: medium}
      - {slug: daymet-tiles-mosaics-regions, severity: medium}
      - {slug: daymet-v4-r1-correction, severity: medium}
      - {slug: daymet-station-sparse-error, severity: low}
