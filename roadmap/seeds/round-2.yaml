# Round two of knowledge seeding: ten seeds run in parallel sessions, one
# bundle each, dispatched and reviewed by a coordinator session. Rendered
# into the sessions' briefs by scripts/seed_brief.py; the roadmap's
# knowledge-seeding initiative carries one deliverable per seed.
round: 2
opened: 2026-09-14
coordinator_rules:
  - One seed per bundle, so no two sessions edit the same index, log or DIGEST.
  - A seed never merges, never signs, never sets a status other than draft.
  - The coordinator lints each PR with the knowledge linter, sends fixes back
    to the seed session, merges on the maintainer's standing instruction, then
    signs, promotes the non-high concepts, registers the eval cases in the
    evals manifests and records the evidence on the roadmap deliverable.
  - High-severity gotchas keep draft with one review until a second human review.
seeds:
  - id: seed-mur-sst-gotchas
    title: MUR SST gotchas for the podaac bundle
    repo: nasa-daac-knowledge
    bundle: knowledge/podaac
    branch: claude/seed-mur-sst
    issue: 133
    spheres: [ocean]
    scope: >-
      Four to five gotchas on the existing dataset concept
      knowledge/podaac/datasets/ghrsst-mur.md (read it first; do not write a
      new dataset concept and do not edit it beyond adding nothing): foundation
      temperature versus skin temperature (the analysis is a foundation SST and
      a diurnal skin comparison against it is wrong); the 0.01 degree grid is
      interpolation and the feature resolution is coarser and varies with the
      inputs, so a front's width read from the grid is not a measurement;
      behaviour at the sea ice edge (the ice mask, the sea_ice_fraction field
      and the fill temperature under ice); analysis_error is the analysis's
      own error estimate and not a validation against buoys, so it is not the
      accuracy of a value; near-real-time versus final files differ in inputs
      and can differ in value for the same day.
    datasets: []
    gotchas:
      - {slug: mur-foundation-not-skin-sst, severity: medium}
      - {slug: mur-grid-is-not-feature-resolution, severity: high}
      - {slug: mur-sea-ice-edge-and-fill, severity: medium}
      - {slug: mur-analysis-error-is-not-validation, severity: medium}
      - {slug: mur-nrt-versus-final, severity: low}
    eval:
      repo: agent-evals
      subtree: mur/cases
      branch: claude/seed-mur-sst
    sources:
      - domain: podaac.jpl.nasa.gov
        read: "the MUR-JPL-L4-GLOB-v4.1 collection page, the user guide and the sea ice handling it documents"
      - domain: doi.org and api.crossref.org
        read: "the product DOI 10.5067/GHGMR-4FJ04 and Chin, Vazquez-Cuervo and Armstrong 2017 (doi 10.1016/j.rse.2017.07.029) on the registry record; the Elsevier page sits behind a bot check, cite the record"
    models:
      - knowledge/podaac/gotchas/grace-intermission-gap.md
      - knowledge/podaac/gotchas/smap-sss-coastal-and-sea-ice-contamination.md
    do_not_repeat:
      - The dataset concept ghrsst-mur.md exists; link it by relative path.
  - id: seed-nsidc-sea-ice
    title: Sea ice concentration and the Sea Ice Index for the nsidc bundle
    repo: nasa-daac-knowledge
    bundle: knowledge/nsidc
    branch: claude/seed-nsidc-sea-ice
    issue: 134
    spheres: [cryosphere]
    scope: >-
      Two dataset concepts and four to five gotchas. Datasets: NSIDC-0051
      version 2, the NASA Team sea ice concentration from SMMR, SSM/I and
      SSMIS (nsidc.org/data/nsidc-0051), and G02135, the Sea Ice Index
      (nsidc.org/data/g02135), which is a NOAA at NSIDC product distributed
      beside the DAAC's and the concept must say which archive holds it.
      Gotchas: the pole hole differs by sensor and each product treats it
      differently, so an Arctic total that ignores it steps at the sensor
      changes; the 15 percent threshold defines extent, and extent is not
      area, so the two series answer different questions; near-real-time
      files (NSIDC-0081) and the final NSIDC-0051 differ in input and
      calibration and a series that mixes them steps at the join; NASA Team
      and Bootstrap concentrations differ systematically in the marginal ice
      zone and in summer melt; sensor transitions (SMMR to SSM/I, F8 to F11
      to F13 to F17) leave steps that the intercalibration reduces and does
      not remove.
    datasets:
      - {slug: nsidc-0051-sea-ice-concentration}
      - {slug: sea-ice-index-g02135}
    gotchas:
      - {slug: sea-ice-pole-hole-by-sensor, severity: high}
      - {slug: sea-ice-extent-is-not-area, severity: medium}
      - {slug: sea-ice-nrt-versus-final, severity: medium}
      - {slug: sea-ice-nasa-team-versus-bootstrap, severity: medium}
      - {slug: sea-ice-sensor-transitions, severity: medium}
    eval:
      repo: agent-evals
      subtree: nsidc/cases
      branch: claude/seed-nsidc-sea-ice
    sources:
      - domain: nsidc.org
        read: "the product pages and user guides for NSIDC-0051 v2, NSIDC-0081, NSIDC-0079 and G02135, and the Sea Ice Index documentation"
      - domain: noaadata.apps.nsidc.org
        read: "the G02135 file listing to confirm file names and the monthly and daily layouts"
      - domain: doi.org and api.crossref.org
        read: "the product DOIs and Cavalieri and others 1999 (doi 10.1029/1999JC900081) and Comiso and others 1997 on the registry records; AGU and Wiley pages sit behind a bot check, cite the records"
    models:
      - knowledge/nsidc/datasets/icesat2-atl15.md
      - knowledge/nsidc/gotchas/atl15-height-change-is-not-mass-change.md
      - knowledge/nsidc/gotchas/polar-stereographic-not-latlon.md
    do_not_repeat:
      - The polar stereographic gotcha exists in this bundle; a sea ice concept links it rather than restating it.
  - id: seed-esdis-requirements-2
    title: Requirements round two for the esdis bundle
    repo: nasa-daac-knowledge
    bundle: knowledge/esdis
    branch: claude/seed-esdis-requirements-2
    issue: 135
    spheres: []
    scope: >-
      Four to six requirement concepts in knowledge/esdis/requirements/, in
      exactly the shape and frontmatter of the eight existing ones (read all
      eight first): granule temporal and spatial extents present and inside
      the collection's extents (class MUST where UMM-G requires the field,
      SHOULD for the containment check); cloud (S3) related URLs present and
      typed GET DATA VIA DIRECT ACCESS for cloud-hosted collections; science
      keywords resolve in GCMD KMS (the existing concept covers platform and
      instrument keywords; this one covers the science keyword hierarchy);
      collection version and DOI agree across versions (a new version carries
      its own DOI or the DOI's landing page states the version); processing
