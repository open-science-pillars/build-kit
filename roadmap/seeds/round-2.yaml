  - id: seed-ocean-tide-gauge-datums
    title: Tide gauge datums and vertical land motion gotchas
    repo: ocean-science
    bundle: knowledge
    branch: claude/seed-tide-gauge-datums
    issue: 50
    spheres: [ocean]
    scope: >-
      Four to five gotchas in knowledge/gotchas/ on the existing connector
      concepts knowledge/connectors/coops-tides.md and
      knowledge/connectors/psmsl-gauges.md (read both first; no new dataset
      concept): PSMSL RLR records are reduced to a station datum and metric
      records are not, so a trend from a metric record can be a datum
      history; the CO-OPS datum choice (MLLW, NAVD88, the station datum) and
      the 1983 to 2001 National Tidal Datum Epoch, so two stations' heights
      compare only on one datum; vertical land motion is in a tide gauge
      record and relative sea level is not sea level, so a gauge trend
      compared with altimetry needs the land motion stated; GIA at a gauge
      is a modelled correction that names its model; a gauge trend needs
      the record length and the gaps stated, and a short record's trend is
      dominated by variability.
    datasets: []
    gotchas:
      - {slug: psmsl-rlr-versus-metric, severity: high}
      - {slug: coops-datum-and-epoch, severity: medium}
      - {slug: tide-gauge-relative-sea-level-and-land-motion, severity: high}
      - {slug: tide-gauge-gia-is-modelled, severity: medium}
      - {slug: tide-gauge-record-length-and-gaps, severity: medium}
    eval:
      repo: agent-evals
      subtree: ecco/cases
      branch: claude/seed-tide-gauge-datums
    sources:
      - domain: psmsl.org
        read: "the RLR documentation, the metric data notes and a station page with its RLR diagram"
      - domain: tidesandcurrents.noaa.gov and api.tidesandcurrents.noaa.gov
        read: "the datum documentation, the National Tidal Datum Epoch page and the API documentation for the datum parameter"
      - domain: doi.org and api.crossref.org
        read: "Holgate and others 2013 (doi 10.2112/JCOASTRES-D-12-00175.1) and Peltier 2004 on the registry records"
    models:
      - knowledge/gotchas/rg-sampled-depth-floor.md
      - knowledge/gotchas/rg-coverage-excludes-high-latitudes-and-marginal-seas.md
    do_not_repeat:
      - The connector concepts; link them by relative path.
