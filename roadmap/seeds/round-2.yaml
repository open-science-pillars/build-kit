  - id: seed-gesdisc-merra2
    title: MERRA-2 for the new gesdisc bundle
    repo: nasa-daac-knowledge
    bundle: knowledge/gesdisc
    branch: claude/seed-gesdisc-merra2
    issue: 136
    spheres: [atmosphere, hydrosphere]
    scope: >-
      The first concepts of the scaffolded, empty knowledge/gesdisc/ bundle
      (its index, log and DIGEST exist; fill the sections, add a log entry,
      re-render the digest). One dataset concept for MERRA-2 (the reanalysis
      as a whole, naming the collections a user meets: M2T1NXSLV, M2T1NXFLX,
      M2TMNXSLV and their monthly and instantaneous siblings, with CMR concept
      ids) and four to five gotchas: PRECTOTCORR is the bias-corrected
      precipitation and PRECTOT the model's, and a water budget that mixes
      them is inconsistent; the hourly time-averaged collections stamp the
      centre of the hour and the instantaneous ones the hour, so a join
      without the offset misaligns by half an hour; the assimilation stream
      boundaries (the four production streams) and the documented
      discontinuities from observing system changes; the 0.5 by 0.625 degree
      grid has cells whose area varies with latitude and a global mean needs
      weights; the collection short names encode frequency, dimension and
      group, and a search by variable name alone finds the wrong collection.
    datasets:
      - {slug: merra-2}
    gotchas:
      - {slug: merra2-prectotcorr-versus-prectot, severity: high}
      - {slug: merra2-time-stamp-conventions, severity: medium}
      - {slug: merra2-stream-boundaries-and-discontinuities, severity: medium}
      - {slug: merra2-grid-weights, severity: low}
      - {slug: merra2-collection-short-names, severity: medium}
    eval:
      repo: agent-evals
      subtree: merra2/cases
      branch: claude/seed-gesdisc-merra2
    sources:
      - domain: disc.gsfc.nasa.gov
        read: "the MERRA-2 collection pages, the file specification document and the README documents"
      - domain: gmao.gsfc.nasa.gov
        read: "the MERRA-2 documentation and the relevant technical memoranda (the file specification, the streams and the precipitation correction)"
      - domain: cmr.earthdata.nasa.gov
        read: "the collection concept ids for the collections named"
      - domain: doi.org and api.crossref.org
        read: "Gelaro and others 2017 (doi 10.1175/JCLI-D-16-0758.1) and Reichle and others 2017 on the precipitation correction, on the registry records"
    models:
      - knowledge/podaac/datasets/grace-fo-mascons.md
      - knowledge/podaac/gotchas/grace-intermission-gap.md
      - knowledge/podaac/gotchas/grace-low-degree-replacements.md
    do_not_repeat:
