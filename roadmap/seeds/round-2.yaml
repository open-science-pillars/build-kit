      - domain: doi.org and api.crossref.org
        read: "Thornton and others 2021 (doi 10.1038/s41597-021-00973-0) on the registry record and at nature.com"
    models:
      - knowledge/podaac/datasets/grace-fo-mascons.md
      - knowledge/podaac/gotchas/grace-intermission-gap.md
    do_not_repeat: []
