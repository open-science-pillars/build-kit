  - id: seed-asdc-ceres-ebaf
    title: CERES EBAF Ed4.2 for the new asdc bundle
    repo: nasa-daac-knowledge
    bundle: knowledge/asdc
    branch: claude/seed-asdc-ceres-ebaf
    issue: 137
    spheres: [atmosphere]
    scope: >-
      The first concepts of the scaffolded, empty knowledge/asdc/ bundle
      (fill the sections, add a log entry, re-render the digest). One dataset
      concept for CERES EBAF Edition 4.2 (TOA and surface, the monthly one
      degree grids, the climatology, the CMR concept id) and four to five
      gotchas: the net TOA flux is anchored so that its global mean matches
      an in situ ocean heating estimate over a stated period, so the EBAF
      imbalance is not an independent check of ocean heat content; the
      clear-sky definitions (total-region clear-sky versus the cloud-free
      composite) and the edition that changed them, so a cloud radiative
      effect names its definition; the surface fluxes are computed with a
      radiative transfer model and assimilated inputs, so their uncertainty
      is larger and differently shaped than TOA; EBAF versus SYN1deg versus
      SSF answer different questions and a diurnal or regional study that
      uses EBAF misses what SYN1deg carries; the climatology period and the
      edition change the anomaly baseline.
    datasets:
      - {slug: ceres-ebaf-ed4-2}
    gotchas:
      - {slug: ebaf-imbalance-anchored-to-ocean-heating, severity: high}
      - {slug: ebaf-clear-sky-definitions, severity: medium}
      - {slug: ebaf-surface-fluxes-are-modelled, severity: medium}
      - {slug: ebaf-versus-syn1deg-versus-ssf, severity: medium}
      - {slug: ebaf-climatology-baseline, severity: low}
    eval:
