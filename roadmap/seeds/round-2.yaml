  - id: seed-obdaac-chlorophyll
    title: Level 3 chlorophyll-a for the new obdaac bundle
    repo: nasa-daac-knowledge
    bundle: knowledge/obdaac
    branch: claude/seed-obdaac-chlorophyll
    issue: 138
    spheres: [biosphere, ocean]
    scope: >-
      The first concepts of the scaffolded, empty knowledge/obdaac/ bundle
      (fill the sections, add a log entry, re-render the digest). Two dataset
      concepts for the level 3 mapped chlorophyll-a grids, MODIS-Aqua and
      PACE OCI (the 4 km and 9 km grids, daily to monthly and climatological
      composites, the reprocessing tag, the CMR concept ids), and four to
      five gotchas: the chlorophyll algorithm is a blend of the band-ratio
      OCx and the color index CI with a stated switch range, so values near
      the switch and in turbid water are algorithm artefacts; monthly
      composites have no data at high latitudes in winter and few in cloudy
      seasons, so a monthly mean is a mean of the sampled days; a
      reprocessing changes the whole record and a series must come from one
      reprocessing; chlorophyll concentration is neither biomass nor primary
      production; MODIS-Aqua's orbit drift late in the mission changes the
      overpass time and the coverage.
    datasets:
      - {slug: modis-aqua-l3-chlorophyll}
      - {slug: pace-oci-l3-chlorophyll}
    gotchas:
      - {slug: chlor-a-blended-ocx-and-ci, severity: high}
      - {slug: chlor-a-composite-sampling-gaps, severity: medium}
      - {slug: chlor-a-one-reprocessing-per-series, severity: medium}
      - {slug: chlor-a-is-not-biomass, severity: medium}
      - {slug: aqua-orbit-drift, severity: low}
