  - id: r3-energy-budget-closure
    wave: B
    kind: computation
    title: Energy budget closure, CERES EBAF net flux against ocean heat content
    repo: nasa-daac-knowledge
    bundle: knowledge/asdc
    branch: claude/r3-energy-budget-closure
    issue: 157
    depends_on: [r3-argo-ohc]
    spheres: [atmosphere, ocean]
    scope: >-
      An attested computation in the sea level budget's shape: the CERES EBAF
      net top-of-atmosphere flux anomaly integrated over a window (the global
      mean over the one degree grid with cos-latitude weights, the anomaly
      against the window's own mean so that the EBAF decade anchoring cancels)
      against the ocean heat content change over the same window read from
      the ocean-science Argo computation's receipt (0 to 2000 m, with the
      stated deep and non-ocean terms added as published numbers with
      sources), the residual stated with the uncertainty of both sides. The
      anchoring gotcha in this bundle is the stated caveat: the absolute EBAF
      imbalance is not independent of ocean heating; the anomaly comparison
      is. Executor with fixture and data-root modes, receipt and refusal
      codes; attester with selftest; a loader for the EBAF term into a
      stamped data root; computation concept, recipe, run skill and a
      registry entry; the numbers anchored to the published Earth energy
      imbalance with sources.
    deliverables:
      - "knowledge/asdc/references/computations/energy_budget.py (--fixture --seed N | --data-root DIR with --ohc-receipt PATH, --window, --runtime, --receipt; refusal exit 3 when the windows do not overlap)"
