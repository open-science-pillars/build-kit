# Round three of seeding: two waves. Wave A has no dependencies between its
# seeds; wave B's closures read what wave A produced. One seed per bundle per
# wave. Kinds: knowledge (concepts), computation (an attested computation in
# the sea level budget's shape), connector (tools on the observations server),
# data-root (a stamped data root and its loaders, no concepts). Rendered into
# briefs by scripts/seed_brief.py; the roadmap carries one deliverable per seed.
round: 3
opened: 2026-09-15
coordinator_rules:
  - One seed per bundle per wave; wave B starts after wave A merges.
  - A seed never merges, never signs, never sets a status other than draft, and
    never edits tools/run_checks.sh or a plugin's check routine; the coordinator
    adds a computation's check chain at merge.
  - The Earthdata token in the environment is used only as a bearer header on a
    download, never printed, logged, stored or committed.
seeds:
  - id: r3-argo-ohc
    wave: A
    kind: computation
    title: Ocean heat content from gridded Argo as an attested computation
    repo: ocean-science
    bundle: knowledge
    branch: claude/r3-argo-ohc
    issue: 54
    spheres: [ocean]
    scope: >-
      An attested computation in this plugin, in the sea level budget's shape:
      global ocean heat content change for 0 to 700 m and 0 to 2000 m from the
      Roemmich and Gilson gridded Argo temperature and salinity (the monthly
      anomaly files and the climatology from sio-argo.ucsd.edu), with
      conservative temperature and in situ density through the gsw
      implementation of TEOS-10, cell area from the grid's latitude weights and
      the product's land mask, layer thickness from the pressure levels, the
      reference climatology and the anomaly convention stated, and the deep
      ocean below 2000 m stated as an omission with the published rate named
      for the reader. The executor runs on a synthetic fixture (--fixture
      --seed N, a known heat content change recovered) or on a data root
      (--data-root DIR) built by a loader from the Roemmich and Gilson files,
      writes a receipt naming the computation, its code hash, the window, the
      terms and the uncertainty, and refuses with a stated exit code when the
      window leaves the product's coverage. Anchor the real-data run to the
      published Argo-era 0 to 2000 m trend with its source and say how far the
      run lands from it.
    deliverables:
      - "knowledge/references/computations/argo_ohc.py: the executor (--fixture --seed N | --data-root DIR, --window YYYY-MM:YYYY-MM, --depth 700|2000, --runtime, --receipt PATH; refusal exit 3 for a window outside coverage)"
      - "knowledge/references/attesters/argo_ohc_check.py: the attester with --selftest, hashing the executor file on disk as the sanctioned code and checking the receipt's arithmetic and bookkeeping statements"
      - "knowledge/references/loaders/ohc_rg_loader.py: builds the data root from the Roemmich and Gilson files with a selftest on a synthetic grid, writing ohc-700.csv, ohc-2000.csv and a stamp"
      - "knowledge/references/loaders/ohc_data_root.py: RECORD.json with the manifest, the stamp and the bookkeeping table (climatology, anomaly convention, coverage, deep omission, uncertainty basis)"
      - "knowledge/references/retrieval/argo-ohc-root/: the committed CSVs, stamps, SOURCES.json and RECORD.json (never the raw product files)"
      - "knowledge/computations/argo-ohc.md (type Attested Computation, status draft), knowledge/recipes/argo-ohc.md, and a run skill under knowledge/references/skills/ in the shape of run-sea-level-budget.md in nasa-daac-knowledge"
      - "the real-data run's numbers in the computation concept with the published anchor and its source"
      - "verification/argo_ohc.py: a golden in the shape of hydrology's verification/basin_water_balance.py that runs the fixture chain, the refusal and the record run on the committed root and asserts the recorded numbers; the coordinator adds the goldens workflow at merge"
    pattern:
      - nasa-daac-knowledge/knowledge/podaac/references/computations/sea_level_budget.py
      - nasa-daac-knowledge/knowledge/podaac/references/attesters/sea_level_budget_check.py
      - nasa-daac-knowledge/knowledge/podaac/references/loaders/slb_steric_rg.py
      - nasa-daac-knowledge/knowledge/podaac/references/loaders/slb_data_root.py
      - nasa-daac-knowledge/knowledge/podaac/computations/sea-level-budget.md
      - hydrology/knowledge/computations/basin-water-balance.md
      - hydrology/knowledge/references/attesters/basin_water_balance_check.py
    sources:
      - domain: sio-argo.ucsd.edu
        read: "the Roemmich and Gilson product page and the monthly anomaly and climatology files (the steric loader in nasa-daac-knowledge shows how they are read)"
      - domain: teos-10.org
        read: "the TEOS-10 manual sections on conservative temperature and the heat capacity constant"
      - domain: doi.org and api.crossref.org
        read: "Roemmich and Gilson 2009 (doi 10.1016/j.pocean.2009.03.004) and the published Argo-era ocean heat content trend used as the anchor (for example von Schuckmann and others or Cheng and others, on the registry records)"
    do_not_repeat:
      - The dataset concept knowledge/datasets/roemmich-gilson-argo-climatology.md and the three rg-* gotchas exist; link them.
      - The podaac bundle's ecco-ocean-heat-content recipe is the ECCO-based counterpart; name it by bundle path.
    boundary: "Edit only under knowledge/ (concepts, references, index.md, log.md) and verification/argo_ohc.py. Do not edit .osp/, README.md, .github/ or any other check script."
