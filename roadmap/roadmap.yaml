decisions:
  - id: ai4s-2026
    title: AI-for-Science submission
    status: declined
    decided: 2026-07-15
    rationale: "The project owner decided not to submit."
  - id: pillar-means-sphere
    title: Pillar means sphere (ADR A)
    status: proposed
    decided: 2026-09-11
    rationale: "Pillars are the five Earth science spheres; disciplines are domain capabilities inside them; provider bundles stay a separate authority axis; classification is canonical under .osp/repository.yaml. Record: marketplace docs/decisions/adr-a-pillar-means-sphere.md; accepted when it merges."
  - id: multi-runtime-packaging
    title: One governed capability, projected to runtimes (ADR B)
    status: proposed
    decided: 2026-09-11
    rationale: "KNOW, ACT, PROVE and REACH are authored once; build-kit renders a Claude projection and an Agent Plugins 1.0 projection; Claude Code, Cowork and Codex are qualification targets; no per-client adapters. Record: marketplace docs/decisions/adr-b-multi-runtime-capability-packaging.md; accepted when it merges."
  - id: one-state-roadmap
    title: One state model for the roadmap
    status: accepted
    decided: 2026-09-13
    rationale: "The proposal-state axis, the seeded proposal issues, the decision labels and the reconcile step were built for a federation of maintainer teams the organization does not yet have. roadmap.yaml stays the single source of truth with one status per deliverable (proposed, active, blocked, done, declined); an active deliverable has an issue in its repository, opened when work starts and closed by the pull request that finishes it; the tool never writes issues. Revisit trigger: adopt GitHub Projects as a rendered view when a second maintainer team declines to edit the YAML or a partner asks for a board; render it from the YAML, one way."

  - id: first-new-sphere-land-ice
    title: Land-ice is the first new sphere, entered through the sea level budget
    status: accepted
    decided: 2026-09-13
    rationale: 'The first sphere opened after the founding domains is land-ice,
      entered through GRACE-FO mass change and the sea level budget rather than
      through ice-sheet altimetry. Reasons: GRACE-FO is a PO.DAAC product, so the
      first non-founding capability carries knowledge signed by the center that
      produces it; the budget composes what exists (altimetry in the provider bundle,
      Argo through the core connector, the GRACE-FO mascon concept) into one
      deterministic computation with a receipt, the first true composite; its traps
      (glacial isostatic adjustment, leakage, the 2017 to 2018 gap between missions,
      degree-1 and C20 replacements, mascon versus spherical-harmonic solutions) are
      the kind the project exists to prevent; and the data is small. Sea-ice follows
      when an NSIDC steward engages; precipitation stays a hydrology slice until it
      carries workflows hydrology does not. Promotion out of planned still waits on
      the pre-registered domain-expansion gate (the powered ablation) and on a dated
      pre-registration entry; the provider-bundle knowledge can be captured before
      that, as the ingest loop allows.'

  - id: promotion-to-host-a-wrap
    title: A planned capability may promote out of planned to host a wrap
    status: accepted
    decided: 2026-09-19
    rationale: 'Supersedes, for one narrow case, the clause of first-new-sphere-land-ice
      that sends every promotion through the domain-expansion gate. A planned capability
      may take package, surfaces and runtime metadata, and a catalog entry, ahead of
      the powered ablation when its release adds no scientific number of its own: every
      number it reports is owned by an attested computation already signed stable in a
      provider bundle and reached through the wrapping rule. The reason is that a
      wrapping skill computes nothing, so what promotion buys is reachability, that an
      agent which installed a capability can run a signed computation rather than a
      reader having to find a concept, and reachability is not the breadth the gate
      protects. The rest of the promotion rule is satisfied in full and not waived: a
      maintainer, sources on every claim, an eval case for every high-severity gotcha
      the release relies on, and a named provider contact invited. A skill that computes
      a number of its own is domain expansion, waits on the ablation, and takes its own
      dated pre-registration entry; building and signing a new attested computation in
      an existing provider bundle stays inside the knowledge intake loop, as the
      hydrology expansion was read in September. The first two capabilities on this
      path are atmospheric-physics and land-ice; a third is a new decision. The
      architectural record is ADR D in the marketplace decisions directory, the
      specification carries the wrap-only release section, and the dated reading against
      the go and stop conditions is the amendment of the same date in the
      pre-registration.'

  - id: provenance-ladder
    title: Provider confirmation is a badge and a ladder, never a gate
    status: accepted
    decided: 2026-09-13
    rationale: 'A steward signature was doing two jobs: the honesty marker (a person
      who knows the product confirmed the claim) and the gate (nothing stable, released,
      promoted or composite without it). The first stays; the second blocked the
      organization on a role nobody at a data center holds yet, and people in these
      domains are only getting accustomed to AI. From now on a verified event carries a
      role (maintainer, provider, community); stable needs one human review of any role;
      high severity needs two, provider preferred and invited, not required; provider
      confirmation is a tier the runtime voices. A provider person can start by
      answering one confirm-this-concept issue, with the maintainer recording the event
      on their behalf; a bundle digest shows them what is claimed about their products.
      Promotion out of planned needs a maintainer, sources, evals and an invited provider
      contact; a composite needs a maintainer and a reviewer per sphere. The maintainer
      who holds a bundle is its steward; interim and handoff language is retired.
      Unchanged: human review before merge (the security control), evidence per claim,
      and the signature debt on edits after a signature.'

