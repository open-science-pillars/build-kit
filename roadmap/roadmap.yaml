      - id: landice-atl15-altimetry
        issue:
          number: 185
          url: https://github.com/open-science-pillars/nasa-daac-knowledge/issues/185
        title: Run the ice sheet balance on ICESat-2 gridded height change beside the velocity-era altimetry
        repo: nasa-daac-knowledge
        status: done
        priority: P1
        depends_on: []
        gate: "Was blocked on network egress, not on the product, the version or the credential, and the gate's own prediction is what closed it: the distribution host was allowed in the environment's network policy on 2026-09-19 and the existing loader then ran unchanged."
        acceptance:
          - "The gridded height change granules are fetched for the committed root's domains, the loader writes its term file and stamp, and the record check passes."
          - "The executor runs both altimetry sources over the same windows, and the concept states what the two agree and disagree on, with the window dependence measured rather than asserted."
          - "Where the two disagree beyond their stated uncertainties, the concept says so plainly and names what would settle it; no verdict is smoothed."
        evidence:
          - "nasa-daac-knowledge PR #190: the registry resolved to the current version and the one after it, the loader's archive constant and file names confirmed to match the current 10 km granules exactly, every fetch route tried and its status recorded in the committed root's SOURCES.json, and the documentation read and found to agree with the loader's documented choices"
          - "The block was the environment's egress policy on the NSIDC distribution host, and nothing else: the same organization already allowed the PO.DAAC distribution host, which is why every PO.DAAC-based computation in this organization has real data and this one did not. Rechecked before the change: the S3 direct-access route issues credentials and then answers 403 on the objects from outside the archive's region, OPeNDAP answers 404 for ATL15 and is not advertised at all for the thickness product, and the legacy archive host is unreachable and carries neither. There was no third route"
          - "nasa-daac-knowledge PR #204: the host was allowed on 2026-09-19 and the same five granules returned HTTP 200, 125 MB, the loader untouched; the committed root carries volume-atl15.csv over 2019-01 to 2026-01 for both ice sheets and names no absent term"
          - "Greenland over 2019-01 through 2023-10, the widest window both altimetry terms and the firn term cover, with the same gravimetric side on both because the parameter changes only the altimetric term: ITS_LIVE gives an altimetric rate of -66.832 Gt/yr and a residual of +154.131 against a bar of 103.948, not closed; ATL15 gives -146.812 and +88.944 against 154.126, closed"
          - "The concept's boundaries had suspected the ITS_LIVE term of drifting after 2019 from the mascons alone. The second record supports that reading and does not settle it, and the concept says so: the two altimetric rates differ by 80 Gt/yr with ATL15 the nearer to the mascons and to published Greenland rates, but their intervals overlap over most of their length, so this is one record sitting where the mascons sit and the other not, rather than a measured discrepancy. ATL15 begins in 2019, so the pre-2019 anchor still stands on ITS_LIVE alone"
          - "Two properties of the pair recorded rather than smoothed: the ATL15 region and the firn cell set differ by 4.2 percent of area, which moves the ATL15 rate by 2.8 Gt/yr under a uniform-change assumption; and ATL15's residual carries the larger effective sample size (14.0 against 6.3) despite a third as many epochs, because the monthly ITS_LIVE differences are strongly autocorrelated, so the verdict flip is carried by the residual as much as by the bar"
          - "Both windows are registered in tools/reference_runs.yaml and wired into run_checks.sh as their own chain; a tampered receipt and a one-byte change to the term file were each rejected. The recorded pre-2019 run reproduces every number it always did, its run identifier having moved only because the identifier binds the data root manifest"
          - "Antarctica still refuses firn-term-missing, which the allowlist change does not touch: that term is a distribution gap and not an egress block, and it is the question open for an NSIDC contact as issue #195"
        contributor:
          readiness: needs-context
          champion: PaulMRamirez
          prerequisites: [the ice sheet balance computation, an Earthdata login for the archive]
        labels: [roadmap, priority:P1]
