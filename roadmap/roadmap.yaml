      figure and the methods paragraph a scientist hands a postdoc are reproducible
      and refuse the headline number the rows do not carry.
    status: active
    priority: P1
    depends_on: []
    gate: "A receipt skill emits only fields of receipts the attester passed, or a table,
      figure or paragraph of such fields, and combines no two receipts into a value no
      receipt carries; the script refuses the aggregate, so the skill is not domain
      expansion and does not wait on the ablation. Admitting one to a wrap-only capability
      is the dated amendment to the promotion-to-host-a-wrap decision that this initiative
      opens with, and the two sphere seeds wait on it."
