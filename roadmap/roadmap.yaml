          - "The pre-registration carries a dated entry reading the amendment against its conditions: a sweep turns a window dependence the concepts already state into a measured table and prejudges nothing."
        evidence:
          - "marketplace PR #106, merged by the decision owner on 2026-09-20: ADR D point 3 amended with a dated paragraph preserving the original wording and stating what was conflated, the specification at 0.6.22 with the receipt skill defined in the wrap-only section, and the pre-registration's dated reading. The first clause of point 3, the ablation as the gate for any number of a capability's own, is untouched"
