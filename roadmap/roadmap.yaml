        contributor:
          readiness: needs-context
          champion: needed
          prerequisites: [OPERA DSWx, PeakFQ, SNODAS, National Water Model retrospective]
        labels: [roadmap, priority:P1]
        issue: {seed: false, number: null, url: null}
